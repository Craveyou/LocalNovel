openapi: 3.0.3
info:
  title: XLib Sync API
  version: 1.0.0
  description: Reading-progress synchronization API for XLib native clients.
servers:
  - url: https://sync.example.com
    description: Placeholder only; production domains are not stored in the repository.
tags:
  - name: auth
  - name: devices
  - name: progress
  - name: operations
paths:
  /v1/auth/start-sync:
    post:
      tags: [auth]
      operationId: startSync
      summary: Create or recover a fixed sync token and register a device.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartSyncRequest"
      responses:
        "200":
          description: Sync identity and device are active.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartSyncResponse"
        "403":
          $ref: "#/components/responses/ApiError"
        "422":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ApiError"
  /v1/devices:
    get:
      tags: [devices]
      operationId: listDevices
      summary: List all devices associated with the current sync identity.
      security:
        - SyncToken: []
          DeviceId: []
      responses:
        "200":
          description: Device list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceListResponse"
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/devices/{deviceId}:
    delete:
      tags: [devices]
      operationId: revokeDevice
      summary: Revoke a device.
      security:
        - SyncToken: []
          DeviceId: []
      parameters:
        - $ref: "#/components/parameters/DeviceIdPath"
      responses:
        "204":
          description: Device revoked.
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/progress:
    get:
      tags: [progress]
      operationId: listProgress
      summary: List all cloud reading progress.
      security:
        - SyncToken: []
          DeviceId: []
      responses:
        "200":
          description: Current progress states.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressListResponse"
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/progress/{bookHash}/{fileSize}:
    delete:
      tags: [progress]
      operationId: deleteBookProgress
      summary: Delete cloud progress for exactly one book belonging to the authenticated identity.
      description: |
        Scoped by the authenticated identity, SHA-256 bookHash and fileSize.
        Returns 204 also when that book has no cloud progress. Other books,
        devices and local data are unaffected. No request body is required.
        Clients confirm the selected book and suspend its uploads for the current
        reading session after success; reopen and compare before resuming uploads.
      security:
        - SyncToken: []
          DeviceId: []
      parameters:
        - name: bookHash
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9a-f]{64}$"
        - name: fileSize
          in: path
          required: true
          description: Canonical positive decimal integer, at most 9007199254740991.
          schema:
            type: string
            pattern: "^[1-9][0-9]*$"
      responses:
        "204":
          description: The selected book has no cloud progress; the identity and other books remain.
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "422":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/progress/sync:
    post:
      tags: [progress]
      operationId: syncProgress
      summary: Arbitrate and store one to 100 progress candidates.
      description: |
        The latest effective readAtMs wins, even when its offset is smaller.
        Equal times are resolved by stable device ID ordering. Current reader
        clients upload only the active formal reading book after comparison;
        the transport batch limit is not authorization to upload an idle library.
      security:
        - SyncToken: []
          DeviceId: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressSyncRequest"
      responses:
        "200":
          description: A decision and final state for each input item, in input order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressSyncResponse"
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "413":
          $ref: "#/components/responses/ApiError"
        "422":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v2/progress/{bookHash}/{fileSize}:
    parameters:
      - in: path
        name: bookHash
        required: true
        schema: {type: string, pattern: '^[0-9a-f]{64}$'}
      - in: path
        name: fileSize
        required: true
        schema: {type: integer, minimum: 1, maximum: 9007199254740991}
    get:
      tags: [progress]
      operationId: getDocumentProgress
      summary: Get only this PDF, EPUB, CBZ, CBR or Kindle source file's typed progress; never exposed to TXT v1.
      security:
        - SyncToken: []
          DeviceId: []
      responses:
        "200":
          description: Zero or one matching state. Missing progress is an empty items array.
          content:
            application/json:
              schema:
                type: object
                required: [serverTimeMs, items]
                properties:
                  serverTimeMs: {$ref: '#/components/schemas/TimestampMs'}
                  items:
                    type: array
                    maxItems: 1
                    items: {$ref: '#/components/schemas/DocumentProgressState'}
        "401": {$ref: '#/components/responses/ApiError'}
        "403": {$ref: '#/components/responses/ApiError'}
        "422": {$ref: '#/components/responses/ApiError'}
        "429": {$ref: '#/components/responses/RateLimited'}
    delete:
      tags: [progress]
      operationId: deleteDocumentProgress
      summary: Delete this source file's progress in both protocol namespaces; idempotent and identity scoped.
      security:
        - SyncToken: []
          DeviceId: []
      responses:
        "204": {description: Deleted or already absent.}
        "401": {$ref: '#/components/responses/ApiError'}
        "403": {$ref: '#/components/responses/ApiError'}
        "422": {$ref: '#/components/responses/ApiError'}
        "429": {$ref: '#/components/responses/RateLimited'}
  /v2/progress/sync:
    post:
      tags: [progress]
      operationId: syncDocumentProgress
      summary: Synchronize PDF/EPUB/CBZ/CBR/Kindle typed positions using reading time and the existing device tie break.
      description: |
        Reject incompatible format/version before time arbitration. For comics,
        profile, manifestHash and pageCount must also match the stored locator;
        pageKey must match only when both locators refer to the same page.
        Mismatch returns 422 VALIDATION_FAILED and rolls back the entire batch.
      security:
        - SyncToken: []
          DeviceId: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DocumentProgressSyncRequest'}
      responses:
        "200":
          description: Decisions in input order; unknown format/version and malformed positions are rejected atomically.
          content:
            application/json:
              schema:
                type: object
                required: [serverTimeMs, results]
                properties:
                  serverTimeMs: {$ref: '#/components/schemas/TimestampMs'}
                  results:
                    type: array
                    items:
                      type: object
                      required: [decision, timeAdjusted, state]
                      properties:
                        decision: {type: string, enum: [accepted, server_kept, unchanged]}
                        timeAdjusted: {type: boolean}
                        state: {$ref: '#/components/schemas/DocumentProgressState'}
        "401": {$ref: '#/components/responses/ApiError'}
        "403": {$ref: '#/components/responses/ApiError'}
        "413": {$ref: '#/components/responses/ApiError'}
        "422": {$ref: '#/components/responses/ApiError'}
        "429": {$ref: '#/components/responses/RateLimited'}
  /health:
    get:
      tags: [operations]
      operationId: health
      summary: Check API and database health.
      security: []
      responses:
        "200":
          description: Healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Database unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /metrics:
    get:
      tags: [operations]
      operationId: metrics
      summary: Export Prometheus metrics for internal monitoring.
      security:
        - MetricsToken: []
      responses:
        "200":
          description: Prometheus text exposition.
          content:
            text/plain:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/ApiError"
components:
  securitySchemes:
    SyncToken:
      type: http
      scheme: bearer
      bearerFormat: 43-character base64url token
    DeviceId:
      type: apiKey
      in: header
      name: X-Device-Id
    MetricsToken:
      type: http
      scheme: bearer
      bearerFormat: metrics token
  headers:
    RequestId:
      description: Request correlation identifier.
      schema:
        type: string
  parameters:
    DeviceIdPath:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    ApiError:
      description: Error response.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RateLimited:
      description: Request rate limit exceeded.
      headers:
        Retry-After:
          description: Seconds before retrying when available.
          schema:
            type: integer
            minimum: 0
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    PdfLocator:
      type: object
      additionalProperties: false
      required: [format, version, page, pageCount, y]
      description: Zero-based page less than pageCount; y is a normalized top-origin page anchor rounded to six decimals.
      properties:
        format: {type: string, enum: [pdf]}
        version: {type: integer, enum: [1]}
        page: {type: integer, minimum: 0, maximum: 99999}
        pageCount: {type: integer, minimum: 1, maximum: 100000}
        y: {type: number, minimum: 0, maximum: 1}
    EpubLocator:
      type: object
      additionalProperties: false
      required: [format, version, resource, spineIndex, spineCount, textOffset, textLength]
      description: Resource is a decoded normalized ZIP path. UTF-16 textOffset is at most textLength; spineIndex is less than spineCount. See local storage contract for text mapping.
      properties:
        format: {type: string, enum: [epub]}
        version: {type: integer, enum: [1]}
        resource: {type: string, minLength: 1, maxLength: 1024}
        spineIndex: {type: integer, minimum: 0, maximum: 9999}
        spineCount: {type: integer, minimum: 1, maximum: 10000}
        textOffset: {type: integer, minimum: 0, maximum: 2147483647}
        textLength: {type: integer, minimum: 0, maximum: 2147483647}
    ComicLocator:
      type: object
      additionalProperties: false
      required: [format, version, profile, manifestHash, pageKey, page, pageCount, y]
      description: |
        comic-order-v1 uses opaque lowercase SHA-256 hashes, never paths.
        Zero-based page must be less than pageCount. The natural top-origin y
        anchor is rounded half-up to six decimal places by the server.
        Progress is (page + 1) / pageCount, independent of y.
        Clients must verify pageKey against their local manifest for that page.
      properties:
        format: {type: string, enum: [cbz, cbr]}
        version: {type: integer, enum: [1]}
        profile: {type: string, enum: [comic-order-v1]}
        manifestHash: {type: string, pattern: '^[0-9a-f]{64}$'}
        pageKey: {type: string, pattern: '^[0-9a-f]{64}$'}
        page: {type: integer, minimum: 0, maximum: 9999}
        pageCount: {type: integer, minimum: 1, maximum: 10000}
        y: {type: number, minimum: 0, maximum: 1}
    KindleLocator:
      type: object
      additionalProperties: false
      required: [format, version, profile, textHash, textOffset, textLength]
      description: |
        kindle-text-v1 hashes UTF-8 canonical publication text with SHA-256.
        Offsets and length count UTF-16 code units, not screen pages or source bytes.
        textOffset is at most textLength; clients also validate grapheme boundaries.
        Progress is textOffset / textLength. Existing identity/profile/hash/length
        must match; incompatible coordinates are rejected, never converted by percentage.
      properties:
        format: {type: string, enum: [kindle]}
        version: {type: integer, enum: [1]}
        profile: {type: string, enum: [kindle-text-v1]}
        textHash: {type: string, pattern: '^[0-9a-f]{64}$'}
        textOffset: {type: integer, minimum: 0, maximum: 2147483647}
        textLength: {type: integer, minimum: 1, maximum: 2147483647}
    DocumentLocator:
      oneOf:
        - {$ref: '#/components/schemas/PdfLocator'}
        - {$ref: '#/components/schemas/EpubLocator'}
        - {$ref: '#/components/schemas/ComicLocator'}
        - {$ref: '#/components/schemas/KindleLocator'}
    DocumentProgressCandidate:
      type: object
      additionalProperties: false
      required: [bookHash, fileSize, locator, readAtMs]
      properties:
        bookHash: {type: string, pattern: '^[0-9a-f]{64}$'}
        fileSize: {type: integer, minimum: 1, maximum: 9007199254740991}
        locator: {$ref: '#/components/schemas/DocumentLocator'}
        readAtMs: {$ref: '#/components/schemas/TimestampMs'}
    DocumentProgressSyncRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          description: Unique source-file identities within each batch.
          items: {$ref: '#/components/schemas/DocumentProgressCandidate'}
    DocumentProgressState:
      type: object
      required: [bookHash, fileSize, locator, progress, readAtMs, version, device]
      properties:
        bookHash: {type: string, pattern: '^[0-9a-f]{64}$'}
        fileSize: {type: integer, minimum: 1, maximum: 9007199254740991}
        locator: {$ref: '#/components/schemas/DocumentLocator'}
        progress: {type: number, minimum: 0, maximum: 1}
        readAtMs: {$ref: '#/components/schemas/TimestampMs'}
        version: {type: string, minLength: 1}
        device: {$ref: '#/components/schemas/DeviceSummary'}
    Platform:
      type: string
      enum: [ios, android]
    DeviceRegistration:
      type: object
      additionalProperties: false
      required: [deviceId, deviceName, platform, appVersion]
      properties:
        deviceId:
          type: string
          format: uuid
        deviceName:
          type: string
          minLength: 1
          maxLength: 80
        platform:
          $ref: "#/components/schemas/Platform"
        appVersion:
          type: string
          minLength: 1
          maxLength: 40
    StartSyncRequest:
      type: object
      additionalProperties: false
      required: [email, device]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        device:
          $ref: "#/components/schemas/DeviceRegistration"
    StartSyncResponse:
      type: object
      required: [token, user, device, serverTimeMs]
      properties:
        token:
          type: string
          pattern: "^[A-Za-z0-9_-]{43}$"
          readOnly: true
        user:
          type: object
          required: [userId, email]
          properties:
            userId:
              type: string
              format: uuid
            email:
              type: string
              format: email
        device:
          $ref: "#/components/schemas/DeviceSummary"
        serverTimeMs:
          $ref: "#/components/schemas/TimestampMs"
    DeviceSummary:
      type: object
      required: [deviceId, deviceName, platform]
      properties:
        deviceId:
          type: string
          format: uuid
        deviceName:
          type: string
        platform:
          $ref: "#/components/schemas/Platform"
    DeviceState:
      allOf:
        - $ref: "#/components/schemas/DeviceSummary"
        - type: object
          required: [appVersion, lastSeenAtMs, createdAtMs, revokedAtMs, current]
          properties:
            appVersion:
              type: string
            lastSeenAtMs:
              $ref: "#/components/schemas/TimestampMs"
            createdAtMs:
              $ref: "#/components/schemas/TimestampMs"
            revokedAtMs:
              type: integer
              format: int64
              nullable: true
            current:
              type: boolean
    DeviceListResponse:
      type: object
      required: [serverTimeMs, items]
      properties:
        serverTimeMs:
          $ref: "#/components/schemas/TimestampMs"
        items:
          type: array
          items:
            $ref: "#/components/schemas/DeviceState"
    ProgressCandidate:
      type: object
      additionalProperties: false
      required: [bookHash, fileSize, offset, readAtMs]
      properties:
        bookHash:
          type: string
          pattern: "^[0-9a-f]{64}$"
        fileSize:
          type: integer
          format: int64
          minimum: 1
        offset:
          type: integer
          format: int64
          minimum: 0
          description: Must be less than or equal to fileSize.
        readAtMs:
          $ref: "#/components/schemas/TimestampMs"
    ProgressSyncRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/ProgressCandidate"
    ProgressState:
      type: object
      required: [bookHash, fileSize, offset, progress, readAtMs, version, device]
      properties:
        bookHash:
          type: string
          pattern: "^[0-9a-f]{64}$"
        fileSize:
          type: integer
          format: int64
          minimum: 1
        offset:
          type: integer
          format: int64
          minimum: 0
        progress:
          type: number
          format: double
          minimum: 0
          maximum: 1
        readAtMs:
          $ref: "#/components/schemas/TimestampMs"
        version:
          type: string
          pattern: "^[0-9]+$"
        device:
          $ref: "#/components/schemas/DeviceSummary"
    ProgressListResponse:
      type: object
      required: [serverTimeMs, items]
      properties:
        serverTimeMs:
          $ref: "#/components/schemas/TimestampMs"
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProgressState"
    ProgressSyncResult:
      type: object
      required: [decision, timeAdjusted, state]
      properties:
        decision:
          type: string
          enum: [accepted, server_kept, unchanged]
        timeAdjusted:
          type: boolean
        state:
          $ref: "#/components/schemas/ProgressState"
    ProgressSyncResponse:
      type: object
      required: [serverTimeMs, results]
      properties:
        serverTimeMs:
          $ref: "#/components/schemas/TimestampMs"
        results:
          type: array
          items:
            $ref: "#/components/schemas/ProgressSyncResult"
    TimestampMs:
      type: integer
      format: int64
      minimum: 0
      maximum: 253402300799999
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, retryable, requestId]
          properties:
            code:
              type: string
            message:
              type: string
            retryable:
              type: boolean
            requestId:
              type: string
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
